services:
  node-app:
    build:
      context: .
      dockerfile: DockerFile
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    # No ports exposed here; only Nginx should be reachable from outside

  nginx-lb:
    image: nginx:latest
    ports:
      - "80:80" # This is the ONLY port you hit from Postman/Browser
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis

  redis:
    image: redis:alpine
